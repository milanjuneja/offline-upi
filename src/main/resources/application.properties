# Server
server.port=8080

# MySQL database
# Configure these environment variables before starting the application.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/upimesh?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Keep schema changes explicit; use migrations before production deployment.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Logging
logging.level.com.demo.upimesh=INFO
logging.pattern.console=%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n

# Idempotency window
upi.mesh.idempotency-ttl-seconds=86400

# Packet freshness window — anything older than this is rejected as replay
upi.mesh.packet-max-age-seconds=86400

# Persistent RSA keys. Back up this directory before moving or redeploying the service.
upi.mesh.crypto.key-directory=${UPI_MESH_KEY_DIRECTORY:./data/upimesh-keys}
